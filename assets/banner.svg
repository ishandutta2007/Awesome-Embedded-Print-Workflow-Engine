<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#ec4899;#f59e0b;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#ec4899;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#fbbf24;#06b6d4;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe600" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffe600" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Raster Gradient -->
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Halftone Dot Pattern -->
    <pattern id="halftoneGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#38bdf8" fill-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#ec4899" fill-opacity="0.08"/>
      <circle cx="24" cy="0" r="1" fill="#ec4899" fill-opacity="0.08"/>
      <circle cx="0" cy="24" r="1" fill="#ec4899" fill-opacity="0.08"/>
      <circle cx="24" cy="24" r="1" fill="#ec4899" fill-opacity="0.08"/>
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#halftoneGrid)"/>

  <!-- Dynamic Animated Ambient Glows -->
  <circle cx="200" cy="120" r="260" fill="url(#cyanGlow)">
    <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;160;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="r" values="240;290;240" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="300" r="280" fill="url(#magentaGlow)">
    <animate attributeName="cx" values="1040;960;1040" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="320;260;320" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="260;310;260" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="380" r="200" fill="url(#yellowGlow)">
    <animate attributeName="cx" values="570;630;570" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Raster Scanning Beam (Simulating Continuous Printhead RIP Processing) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scanbeam)" stroke-width="2.5">
    <animate attributeName="y1" values="30;390;30" dur="7s" repeatCount="indefinite" />
    <animate attributeName="y2" values="30;390;30" dur="7s" repeatCount="indefinite" />
  </line>

  <!-- CMYK Registration Mark (Top Right) -->
  <g transform="translate(1120, 45)" opacity="0.75">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="-5" cy="-5" r="4" fill="#00e5ff" opacity="0.8"/>
    <circle cx="5" cy="-5" r="4" fill="#ff007f" opacity="0.8"/>
    <circle cx="-5" cy="5" r="4" fill="#ffe600" opacity="0.8"/>
    <circle cx="5" cy="5" r="4" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
  </g>

  <!-- Subtle Wave Guide Path in Background -->
  <path d="M 0,210 Q 300,160 600,210 T 1200,210" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,8">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- FOREGROUND CONTENT: Guarantees 100% crispness and visibility -->
  <g id="foreground">
    <!-- Top Category Pill -->
    <g transform="translate(600, 78)">
      <rect x="-175" y="-18" width="350" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="url(#dropShadow)"/>
      <!-- CMYK Indicator Dots -->
      <circle cx="-145" cy="0" r="4" fill="#00e5ff"/>
      <circle cx="-133" cy="0" r="4" fill="#ff007f"/>
      <circle cx="-121" cy="0" r="4" fill="#ffe600"/>
      <circle cx="-109" cy="0" r="4" fill="#000000" stroke="#64748b" stroke-width="1"/>
      <text x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">
        PRINT AUTOMATION &amp; RIP ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="url(#titleGrad)" filter="url(#dropShadow)">
      Awesome Embedded Print Workflow Engines
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" filter="url(#dropShadow)">
      Raster Image Processors (RIP) • ICC Color Management • Prepress Automation • JDF / XJDF Pipelines
    </text>

    <!-- Feature Feature Cards Bar -->
    <g transform="translate(600, 290)">
      <!-- Card 1 -->
      <g transform="translate(-410, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
        <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">
          ⚡ High-Speed RIP Cores
        </text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(-135, 0)">
        <rect x="-115" y="-24" width="230" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
        <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f472b6">
          🎨 ICC &amp; Spot Color Matching
        </text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(145, 0)">
        <rect x="-115" y="-24" width="230" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
        <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#facc15">
          📑 Imposition &amp; Prepress
        </text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(415, 0)">
        <rect x="-105" y="-24" width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)"/>
        <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#4ade80">
          🌐 SaaS &amp; Open-Source
        </text>
      </g>
    </g>

    <!-- Bottom Tagline / Status Strip -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
      A curated, community-driven resource for print engineers, OEMs, print service providers, and prepress operators
    </text>
  </g>
</svg>
